<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>定投量化策略</title>
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f6f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="定投量化策略">
<style>
  :root {
    --bg:#f4f6f9; --card:#fff; --ink:#16181d; --sub:#5b6472; --line:#e4e7ec;
    --red:#dc2626; --orange:#d97706; --amber:#ca8a04; --green:#059669; --blue:#2563eb;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.55; padding:16px 12px 40px; }
  .wrap { max-width:1180px; margin:0 auto; }

  /* ---------- 顶部：名称 + 同步时间 / 当前时间 ---------- */
  header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  header .logo { width:34px; height:34px; border-radius:9px; flex-shrink:0; display:block; }
  h1 { font-size:20px; font-weight:800; letter-spacing:.4px; line-height:1.25; }
  .stamp { font-size:11px; color:var(--sub); margin-top:2px; font-variant-numeric:tabular-nums; }
  .stamp .sep { margin:0 5px; color:#c3cad4; }
  .stamp b { font-weight:600; color:#3d444f; }

  /* ---------- 卡片横排 ---------- */
  .cards { display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory;
           -webkit-overflow-scrolling:touch; padding:2px 12px 12px; margin:0 -12px;
           scrollbar-width:none; }
  .cards::-webkit-scrollbar { display:none; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px;
          padding:14px 15px 13px; box-shadow:0 1px 3px rgba(0,0,0,.05);
          flex:0 0 87%; max-width:87%; scroll-snap-align:center;
          display:flex; flex-direction:column; }
  .ch { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:10px; }
  .ct { font-size:14.5px; font-weight:800; padding-left:8px; border-left:4px solid var(--blue); }
  .card.c-plan .ct { border-color:var(--green); }
  .card.c-us .ct { border-color:var(--blue); }
  .card.c-cn .ct { border-color:var(--red); }
  .more { font-size:11px; color:var(--blue); text-decoration:none; font-weight:700; white-space:nowrap; }

  /* ---------- 分数 ---------- */
  .score { display:flex; align-items:baseline; gap:9px; }
  .score .v { font-size:40px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .score .lv { font-size:11px; font-weight:700; color:#fff; border-radius:99px; padding:2px 9px; }
  .score2 { display:flex; gap:10px; }
  .score2 > div { flex:1; min-width:0; }
  .score2 .k { display:block; font-size:11px; color:var(--sub); }
  .score2 .row { display:flex; align-items:baseline; gap:5px; }
  .score2 .v { font-size:26px; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums; }
  .score2 .lv { font-size:9.5px; font-weight:700; color:#fff; border-radius:99px; padding:1px 6px; }
  .asof { font-size:10px; color:var(--sub); margin-top:5px; }

  /* ---------- 指标分解 ---------- */
  .legs { margin-top:10px; }
  .leg { display:flex; align-items:center; gap:7px; font-size:11.5px; padding:3px 0; }
  .leg .ln { color:#3d444f; width:78px; flex-shrink:0; white-space:nowrap;
             overflow:hidden; text-overflow:ellipsis; }
  .leg .lb { flex:1; height:5px; background:#eef1f5; border-radius:99px; overflow:hidden; min-width:20px; }
  .leg .lb i { display:block; height:100%; border-radius:99px; }
  .leg .lv2 { width:34px; text-align:right; font-weight:700; font-variant-numeric:tabular-nums;
              flex-shrink:0; }
  .leg.hd { font-weight:800; color:var(--ink); padding-top:6px; font-size:11.5px; }
  .leg.hd .lv2 { color:var(--sub); font-weight:600; font-size:9.5px; width:52px; }

  /* ---------- 走势 ---------- */
  .spark { margin-top:9px; }
  .spark svg { width:100%; display:block; }
  .spark .lg { display:flex; gap:10px; font-size:10px; color:var(--sub); margin-top:3px; }
  .spark .lg i { display:inline-block; width:11px; height:2.5px; border-radius:2px;
                 vertical-align:middle; margin-right:3px; }

  /* ---------- 定投方案 ---------- */
  .pctl { display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--sub); margin-bottom:9px; }
  .pctl input { width:88px; padding:5px 9px; font-size:15px; font-weight:800; border:1px solid var(--line);
                border-radius:8px; color:var(--ink); font-family:inherit; font-variant-numeric:tabular-nums; }
  .pctl input:focus { outline:none; border-color:var(--blue); }
  .prow { display:flex; align-items:baseline; gap:8px; font-size:12.5px; padding:6px 0;
          border-bottom:1px dashed var(--line); }
  .prow .pn { font-weight:700; flex:1; min-width:0; }
  .prow .pp { color:var(--sub); font-size:11px; width:34px; text-align:right; flex-shrink:0; }
  .prow .pa { font-weight:800; width:74px; text-align:right; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .prow.tot { border-top:1.5px solid var(--ink); border-bottom:none; margin-top:1px; }
  .rule { font-size:11px; color:var(--sub); margin-top:10px; line-height:1.7; }

  .dots { display:flex; justify-content:center; gap:6px; margin-top:2px; }
  .dots i { width:6px; height:6px; border-radius:50%; background:#ccd3dd; transition:background .2s; }
  .dots i.on { background:var(--blue); }
  footer { font-size:10px; color:var(--sub); text-align:center; margin-top:16px; }

  @media (min-width: 900px) {
    .cards { overflow:visible; }
    .card { flex:1 1 0; max-width:none; }
    .dots { display:none; }
    .score .v { font-size:44px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <img class="logo" src="logo.svg" alt="">
    <div>
      <h1>定投量化策略</h1>
      <div class="stamp">
        <span>系统同步 <b id="sync">—</b></span>
        <span class="sep">|</span>
        <span>当前 <b id="clock">--:--:--</b></span>
      </div>
    </div>
  </header>

  <div class="cards" id="cards">

    <!-- ① 我的定投方案 -->
    <section class="card c-plan">
      <div class="ch"><span class="ct">我的定投方案</span>
        <a class="more" href="plan-v15.html">详情 ›</a></div>
      <div class="pctl">
        <label for="pamt">月投入</label>
        <input type="number" id="pamt" value="5000" min="0" step="100" inputmode="numeric">
        <span>元 ÷ 21 个交易日</span>
      </div>
      <div class="prow" style="font-size:10.5px;color:var(--sub);border-bottom:1px solid var(--line);">
        <span class="pn">标的</span><span class="pp">占比</span><span class="pa">每日</span></div>
      <div id="prows"></div>
      <div class="rule">温度不改变任一档买入金额 · 每个交易日按日申购 · 6/12 月失衡再平衡 ·
        奖金分 3 个月摊入日投</div>
    </section>

    <!-- ② 美股温度计 -->
    <section class="card c-us">
      <div class="ch"><span class="ct">美股温度计</span>
        <a class="more" href="us.html">详情 ›</a></div>
      <div class="score"><span class="v" id="us-v">--</span><span class="lv" id="us-lv">—</span></div>
      <div class="asof" id="us-as">—</div>
      <div class="legs" id="us-legs"></div>
      <div class="spark">
        <svg id="us-chart" viewBox="0 0 320 88" preserveAspectRatio="none"></svg>
        <div class="lg"><span><i style="background:#2563eb"></i>泡沫分</span>
          <span><i style="background:#94a3b8"></i>纳指</span></div>
      </div>
    </section>

    <!-- ③ A股温度计 -->
    <section class="card c-cn">
      <div class="ch"><span class="ct">A股温度计</span>
        <a class="more" href="cn.html">详情 ›</a></div>
      <div class="score2">
        <div><span class="k">市场温度 · 中证全指</span>
          <div class="row"><span class="v" id="cn-mkt">--</span><span class="lv" id="cn-mkt-lv">—</span></div></div>
        <div><span class="k">价值温度 · 红利低波</span>
          <div class="row"><span class="v" id="cn-val">--</span><span class="lv" id="cn-val-lv">—</span></div></div>
      </div>
      <div class="asof" id="cn-as">—</div>
      <div class="legs" id="cn-legs"></div>
      <div class="spark">
        <svg id="cn-chart" viewBox="0 0 320 88" preserveAspectRatio="none"></svg>
        <div class="lg"><span><i style="background:#2563eb"></i>市场温度</span>
          <span><i style="background:#dc2626"></i>价值温度</span></div>
      </div>
    </section>

  </div>
  <div class="dots" id="dots"><i class="on"></i><i></i><i></i></div>

  <footer>仅供研究参考，不构成投资建议</footer>
</div>

const PLAN = [["纳斯达克 100", 30], ["标普 500", 30], ["A股红利低波", 20], ["A股自由现金流", 20]];
const ZONES = [
  { max:45,  name:"低估", color:"#059669" },
  { max:55,  name:"中性", color:"#ca8a04" },
  { max:70,  name:"偏高", color:"#d97706" },

const FEATS = [

];
// A股：档位按「历史百分位」切，比固定阈值线稳（阈值线对样本口径敏感）
const PCT_LEVELS = [
  { min:80, name:"警戒", color:"#dc2626" },
  { min:60, name:"偏高", color:"#d97706" },
  { min:40, name:"中性", color:"#ca8a04" },

const $ = id => document.getElementById(id);
const setTxt = (id, s) => { const e = $(id); if(e) e.textContent = s; };
const zoneOf = t => { for(const z of ZONES){ if(t < z.max) return z; } return ZONES[3]; };
const pctLevel = p => { for(const z of PCT_LEVELS){ if(p > z.min) return z; } return PCT_LEVELS[4]; };
const bjDate = () => new Date(Date.now() + 8 * 3600e3);

function tag(el, name, color){
  el.textContent = name;
  el.style.background = color;
}

// ---------------- ① 定投方案 ----------------
function renderPlan(){
  const x = parseFloat($("pamt").value) || 0;
  const per = x / DAYS;
  let h = "", sum = 0;
  for(const [n, p] of PLAN){
    const v = Math.round(per * p / 100); sum += v;
    h += `<div class="prow"><span class="pn">${n}</span><span class="pp">${p}%</span>`
       + `<span class="pa">¥${v.toLocaleString("zh-CN")}</span></div>`;
  }
  h += `<div class="prow tot"><span class="pn">合计</span><span class="pp">100%</span>`
     + `<span class="pa">¥${sum.toLocaleString("zh-CN")}</span></div>`;
  $("prows").innerHTML = h;
}
function bindPlan(){
  const inp = $("pamt");
  const saved = localStorage.getItem("pamt");
  if(saved !== null) inp.value = saved;
  inp.addEventListener("input", e => { renderPlan(); localStorage.setItem("pamt", e.target.value); });
  renderPlan();
}

// ---------------- 迷你走势图 ----------------
// lines: [{v:[..], c:'#hex', w:2, min, max}]   两条线可各自量纲（美股 = 分数 + 纳指）
function drawSpark(el, W, H, lines){
  const L = 4, R = 4, T = 7, B = 4;
  const iw = W - L - R, ih = H - T - B;
  let s = "";
  for(const ln of lines){
    const v = ln.v, n = v.length;
    if(n < 2) continue;
    let lo = ln.min, hi = ln.max;
    if(lo == null){ lo = Math.min(...v); hi = Math.max(...v); }
    if(hi - lo < 1e-9) hi = lo + 1;
    const X = i => L + i / (n - 1) * iw;
    const Y = x => T + (1 - (x - lo) / (hi - lo)) * ih;
    s += `<polyline points="${v.map((x, i) => `${X(i).toFixed(1)},${Y(x).toFixed(1)}`).join(" ")}"`
       + ` fill="none" stroke="${ln.c}" stroke-width="${ln.w || 1.8}" stroke-linejoin="round"`
       + ` stroke-linecap="round" opacity="${ln.op || 1}"/>`;
    const li = n - 1;
    s += `<circle cx="${X(li).toFixed(1)}" cy="${Y(v[li]).toFixed(1)}" r="2.6" fill="${ln.c}"`
       + ` stroke="#fff" stroke-width="1.2"/>`;
  }
  el.setAttribute("viewBox", `0 0 ${W} ${H}`);
  el.innerHTML = s;
}

// ---------------- ② 美股卡片 ----------------
function renderUS(){
  const wk = DATA.week, cur = wk[wk.length - 1];
  const z = zoneOf(cur.total);
  setTxt("us-v", cur.total.toFixed(1));
  $("us-v").style.color = z.color;
  tag($("us-lv"), z.name, z.color);
  setTxt("us-as", `截至 ${cur.d}`);
  $("us-legs").innerHTML = FEATS.map(f => {
    const v = cur[f.k] ?? 0;
    const c = f.k === "s7" ? "#9ca3af" : zoneOf(v).color;
    return `<div class="leg"><span class="ln">${f.n}</span>`
         + `<span class="lb"><i style="width:${Math.max(3, v)}%;background:${c}"></i></span>`
         + `<span class="lv2" style="color:${c}">${v.toFixed(0)}</span></div>`;
  }).join("");
  const seg = wk.slice(-260);
  drawSpark($("us-chart"), 320, 88, [
    { v: seg.map(d => d.total), c: "#2563eb", w: 2, min: 0, max: 100 },
    { v: seg.map(d => d.ndx),  c: "#94a3b8", w: 1.4, op: .85 },
  ]);
}

// ---------------- ③ A股卡片 ----------------
function renderCN(){
  const cn = DATA.cn;
  if(!cn || !cn.records || !cn.records.length){
    setTxt("cn-mkt", "--"); setTxt("cn-val", "--");
    setTxt("cn-as", "数据尚未接入");
    $("cn-legs").innerHTML = "";
    return;
  }
  const rs = cn.records, cur = rs[rs.length - 1];
  const hm = (cn.meta && cn.meta.hist) || {};
  const m = hm.mkt || {}, v = hm.val || {};
  const ml = pctLevel(m.pos == null ? 50 : m.pos);
  const vl = pctLevel(v.pos == null ? 50 : v.pos);

  setTxt("cn-mkt", cur.mkt.toFixed(1)); $("cn-mkt").style.color = ml.color;
  setTxt("cn-val", cur.val.toFixed(1)); $("cn-val").style.color = vl.color;
  tag($("cn-mkt-lv"), ml.name, ml.color);
  tag($("cn-val-lv"), vl.name, vl.color);
  setTxt("cn-as", `截至 ${cur.d}`
    + (m.pos == null ? "" : `　市场 历史 ${m.pos.toFixed(0)}%`)
    + (v.pos == null ? "" : `　价值 历史 ${v.pos.toFixed(0)}%`));

  // 取数指标分解：市场温度是单一指标；价值温度 = 估值腿 + 全市场腿 + 板块拥挤度
  const bar = (n, val, color, right) =>
    `<div class="leg"><span class="ln">${n}</span>`
    + `<span class="lb"><i style="width:${Math.max(3, val)}%;background:${color}"></i></span>`
    + `<span class="lv2" style="color:${color}">${right}</span></div>`;
  let h = `<div class="leg hd"><span class="ln">市场温度</span>`
        + `<span class="lb"></span><span class="lv2">100%</span></div>`;
  h += bar("全指PE分位", cur.mkt, ml.color, cur.mkt.toFixed(0));
  h += `<div class="leg hd"><span class="ln">价值温度</span>`
     + `<span class="lb"></span><span class="lv2">55/30/15</span></div>`;
  h += bar("估值腿", cur.est, vl.color, cur.est.toFixed(0));
  h += bar("全市场腿", cur.bkg, vl.color, cur.bkg.toFixed(0));
  h += bar("板块拥挤度", cur.crowd, vl.color, cur.crowd.toFixed(0));
  $("cn-legs").innerHTML = h;

  const seg = rs.slice(-260);
  drawSpark($("cn-chart"), 320, 88, [
    { v: seg.map(d => d.mkt), c: "#2563eb", w: 1.8, min: 0, max: 100 },
    { v: seg.map(d => d.val), c: "#dc2626", w: 2,   min: 0, max: 100 },
  ]);
}

// ---------------- 时间戳 ----------------
function stampData(){
  const m = (DATA && DATA.meta) || {};
  setTxt("sync", m.updated || "—");
  const cnUp = DATA && DATA.cn && DATA.cn.meta && DATA.cn.meta.updated;
  if(cnUp && m.updated && cnUp < m.updated) setTxt("sync", cnUp);
}
function tick(){
  const d = bjDate();
  const p = n => String(n).padStart(2, "0");
  setTxt("clock", `${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())}`);
}

// ---------------- 横滑圆点 ----------------
function bindDots(){
  const box = $("cards"), dots = [...$("dots").children];
  const upd = () => {
    const c = box.scrollLeft, w = box.clientWidth;
    const i = Math.max(0, Math.min(dots.length - 1, Math.round(c / (w * 0.9))));
    dots.forEach((d, k) => d.classList.toggle("on", k === i));
  };
  box.addEventListener("scroll", upd, { passive:true });
  dots.forEach((d, k) => d.addEventListener("click",
    () => box.scrollTo({ left: box.children[k].offsetLeft - box.offsetLeft - 12, behavior:"smooth" })));
  upd();
}

function renderAll(){
  renderUS();
  renderCN();
  renderPlan();
  const us = DATA.week[DATA.week.length - 1];
  let t = `定投量化策略 · 美股 ${us.total.toFixed(1)}`;
  if(DATA.cn && DATA.cn.records && DATA.cn.records.length){
    const c = DATA.cn.records[DATA.cn.records.length - 1];
    t += ` · A股 市场 ${c.mkt.toFixed(0)} / 价值 ${c.val.toFixed(0)}`;
  }
  document.title = t;
}

async function fetchJson(url, ms){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 6000);
  try{
    const r = await fetch(url, { cache:"no-store", signal: ctl.signal });
    if(!r.ok) return null;
    const j = await r.json();
    return (j && j.week && j.week.length) ? j : null;
  }catch(e){ return null; }
  finally{ clearTimeout(t); }
}
function isStale(j){
  if(!j || !j.meta || !j.meta.updated) return false;
  if(!FALLBACK || !FALLBACK.meta || !FALLBACK.meta.updated) return false;
  return j.meta.updated < FALLBACK.meta.updated;
}
async function loadData(){
  for(const s of REMOTE_SOURCES){
    const j = await fetchJson(s.u);
    if(j && !isStale(j)) return j;
  }
  const j = await fetchJson("data.json", 4000);
  if(j && !isStale(j)) return j;
  return FALLBACK;
}

// 先用内嵌快照立即出图（不等网络），远程拿到更新的数据再覆盖一次
DATA = FALLBACK;
stampData();
renderAll();
bindPlan();
bindDots();
tick();
setInterval(tick, 1000);
loadData().then(j => {
  if(j && j !== DATA){ DATA = j; stampData(); renderAll(); }
}).catch(() => {});
</script>
</body>
