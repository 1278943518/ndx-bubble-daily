<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- ★ 关掉网页版缩放（双击放大 / 双指放大），更像原生 App；iOS 会忽略 user-scalable=no，
     所以另有 CSS touch-action + JS gesture 兜底，见下方 <style> 与 <script> -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>定投量化策略</title>
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f6f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="定投量化策略">
<style>
  :root {
    --bg:#f4f6f9; --card:#fff; --ink:#16181d; --sub:#5b6472; --line:#e4e7ec;
    --red:#dc2626; --orange:#d97706; --amber:#ca8a04; --green:#059669; --blue:#2563eb;
    --tabh:58px;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  /* ★ 禁止双指缩放 / 双击放大（html/body 的 touch-action 会向下取交集，整页生效） */
  html, body { touch-action:pan-x pan-y; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.55;
         padding:16px 12px calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);
         min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  .wrap { max-width:560px; margin:0 auto; width:100%; flex:1 1 auto; display:flex; flex-direction:column; }

  /* ===== 底部导航（三页共用 · 全屏切换） ===== */
  .tabbar { position:fixed; left:0; right:0; bottom:0; z-index:80; display:flex;
            background:rgba(255,255,255,.97); -webkit-backdrop-filter:saturate(180%) blur(14px);
            backdrop-filter:saturate(180%) blur(14px); border-top:1px solid var(--line);
            box-shadow:0 -1px 12px rgba(22,24,29,.05);
            padding-bottom:env(safe-area-inset-bottom); }
  .tabbar a { flex:1 1 0; min-width:0; position:relative; display:flex; flex-direction:column;
              align-items:center; justify-content:center; gap:2px; padding:7px 2px 6px;
              text-decoration:none; color:#8b93a1; font-size:10.5px; font-weight:600;
              white-space:nowrap; }
  .tabbar a svg { width:21px; height:21px; display:block; }
  .tabbar a.on { color:var(--ac); font-weight:800; }
  .tabbar a.on::before { content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
                         width:26px; height:2.5px; border-radius:0 0 3px 3px; background:var(--ac); }
  .tabbar a:active { background:#f0f3f7; }

  /* ===== 顶部 ===== */
  header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  header .logo { width:34px; height:34px; border-radius:9px; flex-shrink:0; display:block; }
  h1 { font-size:20px; font-weight:800; letter-spacing:.4px; line-height:1.25; }
  .stamp { font-size:11px; color:var(--sub); margin-top:2px; font-variant-numeric:tabular-nums; }
  .stamp .sep { margin:0 5px; color:#c3cad4; }
  .stamp b { font-weight:600; color:#3d444f; }

  /* ===== 卡片 ===== */
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px;
          padding:15px 16px 14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  h2 { font-size:13.5px; font-weight:700; margin-bottom:12px; padding-left:8px;
       border-left:4px solid var(--green); display:flex; align-items:baseline;
       justify-content:space-between; gap:8px; }
  h2 .tip { font-size:10px; color:var(--sub); font-weight:400; }

  /* ===== 月投入 / 每日 ===== */
  .pctl { display:flex; align-items:center; gap:12px; }
  .pctl > label { font-size:12px; color:var(--sub); flex-shrink:0; }
  .pbox { display:flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:10px;
          padding:4px 10px; background:#fbfcfd; }
  .pbox input { width:92px; border:none; background:transparent; font-size:19px; font-weight:800;
                color:var(--ink); font-family:inherit; font-variant-numeric:tabular-nums; outline:none; }
  .pbox span { font-size:11px; color:var(--sub); }
  .pbox:focus-within { border-color:var(--blue); background:#fff; }
  .perday { margin-left:auto; text-align:right; }
  .perday .k { font-size:10px; color:var(--sub); display:block; }
  .perday .v { font-size:22px; font-weight:800; line-height:1.1; color:var(--green);
               font-variant-numeric:tabular-nums; }

  /* ===== 标的表 ===== */
  .prow { display:flex; align-items:center; gap:8px; font-size:13px; padding:8px 0;
          border-bottom:1px dashed var(--line); }
  .prow:last-child { border-bottom:none; }
  .prow .pn { font-weight:700; flex:1; min-width:0; }
  .prow .pp { color:var(--sub); font-size:11px; width:38px; text-align:right; flex-shrink:0;
              font-variant-numeric:tabular-nums; }
  .prow .pa { font-weight:800; width:82px; text-align:right; flex-shrink:0;
              font-variant-numeric:tabular-nums; }
  .prow.ph { padding:0 0 6px; border-bottom:1px solid var(--line); font-size:10.5px; color:var(--sub);
             font-weight:600; }
  .prow.ph .pa, .prow.ph .pp { font-weight:600; font-size:10.5px; }
  .prow.tot { border-top:1.5px solid var(--ink); border-bottom:none; margin-top:1px; padding-top:9px; }
  .prow.tot .pa { color:var(--ink); }

  /* ===== 规则 ===== */
  .rule { list-style:none; }
  .rule li { display:flex; gap:8px; font-size:12px; color:#3d444f; padding:5px 0;
             border-bottom:1px dashed var(--line); line-height:1.6; }
  .rule li:last-child { border-bottom:none; }
  .rule li b { color:var(--ink); }
  .rule .no { flex-shrink:0; width:16px; height:16px; border-radius:50%; background:#eef1f5;
              color:var(--sub); font-size:10px; font-weight:700; line-height:16px; text-align:center;
              margin-top:2px; }

  /* ===== 入口 ===== */
  .entry { display:flex; align-items:center; gap:10px; background:var(--card);
           border:1px solid var(--line); border-radius:14px; padding:13px 16px;
           text-decoration:none; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.05);
           font-size:13px; font-weight:600; }
  .entry .arw { margin-left:auto; color:var(--sub); font-size:17px; line-height:1; }
  .entry:active { background:#f0f3f7; }
  .entry .tag { font-size:10px; font-weight:700; color:#fff; background:var(--green);
                border-radius:5px; padding:1.5px 6px; }

  footer { font-size:10px; color:var(--sub); text-align:center; margin-top:auto; padding-top:14px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <img class="logo" src="logo.svg" alt="">
    <div>
      <h1>定投量化策略</h1>
      <div class="stamp">
        <span>系统同步 <b id="sync">—</b></span>
        <span class="sep">|</span>
        <span>当前 <b id="clock">--:--:--</b></span>
      </div>
    </div>
  </header>

  <div class="card">
    <h2>我的定投方案 <span class="tip">温度只展示，不改变金额</span></h2>
    <div class="pctl">
      <label for="pamt">月投入</label>
      <div class="pbox"><input type="number" id="pamt" value="5000" min="0" step="100" inputmode="numeric"><span>元</span></div>
      <div class="perday"><span class="k">每日合计</span><span class="v" id="per">—</span></div>
    </div>
    <div class="prow ph"><span class="pn">标的</span><span class="pp">占比</span><span class="pa">每日</span></div>
    <div id="prows"></div>
  </div>

  <div class="card">
    <h2>执行规则 <span class="tip">v1.6</span></h2>
    <ul class="rule">
      <li><span class="no">1</span><span>每个交易日按日申购，<b>温度不改变任一档买入金额</b></span></li>
      <li><span class="no">2</span><span>每月按 <b>21 个交易日</b>把月投入摊到每日</span></li>
      <li><span class="no">3</span><span>每年 <b>6 月 / 12 月</b>检查权重，偏离目标则再平衡</span></li>
      <li><span class="no">4</span><span>奖金（2 月 2 万 · 下半年 1 万）<b>分 3 个月摊入日投</b></span></li>
    </ul>
  </div>

  <a class="entry" href="plan-v15.html">
    <span class="tag">v1.6</span>
    <span>完整方案 · 标的代码与再平衡细则</span>
    <span class="arw">›</span>
  </a>

  <footer>仅供研究参考，不构成投资建议</footer>
</div>

<nav class="tabbar">
  <a href="index.html" style="--ac:#059669" class="on" aria-current="page">

    定投方案</a>
  <a href="us.html" style="--ac:#2563eb">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 18a8.5 8.5 0 1 1 17 0"/><path d="M12 18l4.2-5.4"/><circle cx="12" cy="18" r="1.7" fill="currentColor" stroke="none"/></svg>
    美股温度计</a>
  <a href="cn.html" style="--ac:#dc2626">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13.6V5a2 2 0 1 1 4 0v8.6"/><circle cx="12" cy="17" r="3.4"/></svg>
    A股温度计</a>
</nav>

<script>
// ★ 关掉「网页版」缩放手势（双击放大 / 双指放大），让页面更像原生 App。
//   viewport 的 user-scalable=no 在 iOS 10+ 被忽略，所以这里再兜一层。
if("ongesturestart" in window){
  ["gesturestart", "gesturechange", "gestureend"].forEach(t =>
    document.addEventListener(t, e => e.preventDefault(), { passive:false }));
  document.addEventListener("touchmove", e => {
    if(e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive:false });
}

let DATA = null;
const FALLBACK = __DATA__;

// ---------------- 常量 ----------------
const DAYS = 21;                                   // 每月约 21 个交易日
const PLAN = [["纳斯达克 100", 30], ["标普 500", 30], ["A股红利低波", 20], ["A股自由现金流", 20]];

const $ = id => document.getElementById(id);
const setTxt = (id, s) => { const e = $(id); if(e) e.textContent = s; };
const bjDate = () => new Date(Date.now() + 8 * 3600e3);
const money = v => "¥" + Math.round(v).toLocaleString("zh-CN");

// ---------------- 定投表 ----------------
function renderPlan(){
  const x = parseFloat($("pamt").value) || 0;
  const per = x / DAYS;
  setTxt("per", money(per));
  let h = "", sum = 0;
  for(const [n, p] of PLAN){
    const v = Math.round(per * p / 100); sum += v;
    h += `<div class="prow"><span class="pn">${n}</span><span class="pp">${p}%</span>`
       + `<span class="pa">${money(v)}</span></div>`;
  }
  h += `<div class="prow tot"><span class="pn">合计</span><span class="pp">100%</span>`
     + `<span class="pa">${money(sum)}</span></div>`;
  $("prows").innerHTML = h;
}
function bindPlan(){
  const inp = $("pamt");
  const saved = localStorage.getItem("pamt");
  if(saved !== null) inp.value = saved;
  inp.addEventListener("input", e => { renderPlan(); localStorage.setItem("pamt", e.target.value); });
  renderPlan();
}

// ---------------- 时间戳 ----------------
function stampData(){
  const m = (DATA && DATA.meta) || {};
  let up = m.updated;
  const cnUp = DATA && DATA.cn && DATA.cn.meta && DATA.cn.meta.updated;
  if(cnUp && up && cnUp < up) up = cnUp;
  setTxt("sync", up || "—");
}
function tick(){
  const d = bjDate();
  const p = n => String(n).padStart(2, "0");
  setTxt("clock", `${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())}`);
}

// ---------------- 数据加载：多源容灾 ----------------
const _dayKey = bjDate().toISOString().slice(0, 10).replace(/-/g, "");
const REMOTE_SOURCES = [
  { u:"https://cdn.jsdelivr.net/gh/1278943518/ndx-bubble-daily@main/bubble_app/data.json?v=" + _dayKey, n:"jsDelivr CDN" },
  { u:"https://raw.githubusercontent.com/1278943518/ndx-bubble-daily/main/bubble_app/data.json?v=" + _dayKey, n:"GitHub raw" },
];
async function fetchJson(url, ms){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 6000);
  try{
    const r = await fetch(url, { cache:"no-store", signal: ctl.signal });
    if(!r.ok) return null;
    const j = await r.json();
    return (j && j.week && j.week.length) ? j : null;
  }catch(e){ return null; }
  finally{ clearTimeout(t); }
}
function isStale(j){
  if(!j || !j.meta || !j.meta.updated) return false;
  if(!FALLBACK || !FALLBACK.meta || !FALLBACK.meta.updated) return false;
  return j.meta.updated < FALLBACK.meta.updated;
}
async function loadData(){
  for(const s of REMOTE_SOURCES){
    const j = await fetchJson(s.u);
    if(j && !isStale(j)) return j;
  }
  const j = await fetchJson("data.json", 4000);
  if(j && !isStale(j)) return j;
  return FALLBACK;
}

// 先用内嵌快照立即出图（不等网络），远程拿到更新的数据再覆盖一次
DATA = FALLBACK;
stampData();
bindPlan();
tick();
setInterval(tick, 1000);
loadData().then(j => {
  if(j && j !== DATA){ DATA = j; stampData(); }
}).catch(() => {});
</script>
</body>
